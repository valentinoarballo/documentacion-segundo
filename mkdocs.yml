site_name: Desarrollo Frontend
site_url: https://TU-USUARIO.github.io/TU-REPO/

theme:
  name: material
  language: es
  logo: assets/logo.png
  favicon: assets/favicon.jpeg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/custom.css

nav:
  - Inicio: index.md
  - Tema 1. Introducción a JavaScript: tema1.md
  - Tema 2. Variables, bloques y scope: tema2.md
  - Tema 3. Bucles: tema3.md
  - Tema 4. Funciones: tema4.md
  - Tema 5. DOM y eventos: tema5.md
  - Tema 6. Fetch y LocalStorage: tema6.md
  - Tema 7. Configuración de React: tema7.md
  - Tema 8. Componentes de React: tema8.md
  - Tema 9. useState y useEffect: tema9.md
  - Tema 10. Rutas base con React Router DOM: tema10.md
  - Tema 11. Rutas dinámicas y anidadas: tema11.md
  - Tema 12. useContext: tema12.md
  - Tema 13. Formularios controlados: tema13.md
  - Tema 14. Gitflow y tableros Kanban: tema14.md
  - Tema 15. Formulario de carga y despliegue en Vercel: tema15.md
  - Tema 16. Configuración de conexión en aplicaciones desplegadas: tema16.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  
site_url: https://valentinoarballo.github.io/documentacion-segundo/